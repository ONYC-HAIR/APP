<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Scraper</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .main-container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 2rem;
        }
        
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
            background: rgba(255,255,255,0.9);
        }
        
        .card-header {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border-radius: 15px 15px 0 0 !important;
            text-align: center;
            padding: 2rem;
        }
        
        .form-control, .form-select {
            border-radius: 10px;
            border: 2px solid #e9ecef;
            padding: 12px 15px;
            transition: all 0.3s ease;
        }
        
        .form-control:focus, .form-select:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        
        .btn-primary {
            background: linear-gradient(45deg, #667eea, #764ba2);
            border: none;
            border-radius: 10px;
            padding: 12px 30px;
            font-weight: 600;
            transition: transform 0.3s ease;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            background: linear-gradient(45deg, #5a6fd8, #6a4190);
        }
        
        .platform-checkbox {
            margin: 5px 10px 5px 0;
        }
        
        .results-container {
            margin-top: 2rem;
        }
        
        .profile-card {
            border: 1px solid #dee2e6;
            border-radius: 10px;
            margin-bottom: 1rem;
            padding: 1rem;
            background: white;
            transition: box-shadow 0.3s ease;
        }
        
        .profile-card:hover {
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .platform-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .platform-linkedin { background-color: #0077b5; color: white; }
        .platform-twitter { background-color: #1da1f2; color: white; }
        .platform-github { background-color: #333; color: white; }
        .platform-facebook { background-color: #4267b2; color: white; }
        .platform-instagram { background-color: #e4405f; color: white; }
        .platform-other { background-color: #6c757d; color: white; }
        
        .contact-info {
            background-color: #f8f9fa;
            border-radius: 8px;
            padding: 10px;
            margin-top: 10px;
        }
        
        .loading-spinner {
            display: none;
            text-align: center;
            margin: 2rem 0;
        }
        
        .progress-container {
            margin: 1rem 0;
        }
        
        .alert {
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container main-container">
        <div class="card">
            <div class="card-header">
                <h1 class="mb-0">
                    <i class="fas fa-search me-2"></i>
                    Profile Scraper
                </h1>
                <p class="mb-0 mt-2">Find public profile information using keywords</p>
            </div>
            
            <div class="card-body">
                <form id="searchForm">
                    <div class="mb-4">
                        <label for="keyword" class="form-label">
                            <i class="fas fa-key me-1"></i>
                            Search Keyword
                        </label>
                        <input type="text" class="form-control" id="keyword" placeholder="Enter name, company, or any keyword..." required>
                        <div class="form-text">Enter a name, company, skill, or any keyword to search for profiles</div>
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label">
                            <i class="fas fa-globe me-1"></i>
                            Target Platforms (optional)
                        </label>
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-check platform-checkbox">
                                    <input class="form-check-input" type="checkbox" value="linkedin" id="linkedin">
                                    <label class="form-check-label" for="linkedin">
                                        <i class="fab fa-linkedin text-primary me-1"></i>LinkedIn
                                    </label>
                                </div>
                                <div class="form-check platform-checkbox">
                                    <input class="form-check-input" type="checkbox" value="twitter" id="twitter">
                                    <label class="form-check-label" for="twitter">
                                        <i class="fab fa-twitter text-info me-1"></i>Twitter
                                    </label>
                                </div>
                                <div class="form-check platform-checkbox">
                                    <input class="form-check-input" type="checkbox" value="github" id="github">
                                    <label class="form-check-label" for="github">
                                        <i class="fab fa-github text-dark me-1"></i>GitHub
                                    </label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-check platform-checkbox">
                                    <input class="form-check-input" type="checkbox" value="facebook" id="facebook">
                                    <label class="form-check-label" for="facebook">
                                        <i class="fab fa-facebook text-primary me-1"></i>Facebook
                                    </label>
                                </div>
                                <div class="form-check platform-checkbox">
                                    <input class="form-check-input" type="checkbox" value="instagram" id="instagram">
                                    <label class="form-check-label" for="instagram">
                                        <i class="fab fa-instagram text-danger me-1"></i>Instagram
                                    </label>
                                </div>
                            </div>
                        </div>
                        <div class="form-text">Leave all unchecked to search all platforms</div>
                    </div>
                    
                    <div class="text-center">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="fas fa-search me-2"></i>
                            Start Scraping
                        </button>
                    </div>
                </form>
                
                <div class="loading-spinner" id="loadingSpinner">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="mt-2">Searching for profiles...</p>
                    <div class="progress progress-container">
                        <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%"></div>
                    </div>
                </div>
                
                <div class="results-container" id="resultsContainer">
                    <!-- Results will be populated here -->
                </div>
            </div>
        </div>
        
        <div class="text-center mt-3">
            <a href="/dashboard" class="btn btn-outline-light">
                <i class="fas fa-chart-line me-1"></i>
                View Dashboard
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentJobId = null;
        let progressInterval = null;

        document.getElementById('searchForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const keyword = document.getElementById('keyword').value.trim();
            if (!keyword) return;
            
            // Get selected platforms
            const platforms = [];
            document.querySelectorAll('input[type="checkbox"]:checked').forEach(checkbox => {
                platforms.push(checkbox.value);
            });
            
            // Show loading
            document.getElementById('loadingSpinner').style.display = 'block';
            document.getElementById('resultsContainer').innerHTML = '';
            
            try {
                // Start search
                const response = await fetch('/search', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ keyword, platforms })
                });
                
                const data = await response.json();
                
                if (data.error) {
                    showAlert('danger', data.error);
                    return;
                }
                
                currentJobId = data.job_id;
                showAlert('info', `Search started for "${keyword}". Tracking job: ${currentJobId}`);
                
                // Start polling for status
                pollJobStatus();
                
            } catch (error) {
                showAlert('danger', 'Failed to start search: ' + error.message);
            } finally {
                document.getElementById('loadingSpinner').style.display = 'none';
            }
        });
        
        async function pollJobStatus() {
            if (!currentJobId) return;
            
            try {
                const response = await fetch(`/status/${currentJobId}`);
                const status = await response.json();
                
                if (status.error) {
                    showAlert('danger', status.error);
                    return;
                }
                
                // Update progress bar
                const progressBar = document.querySelector('.progress-bar');
                if (status.status === 'running') {
                    progressBar.style.width = '50%';
                    setTimeout(pollJobStatus, 2000); // Poll every 2 seconds
                } else if (status.status === 'completed') {
                    progressBar.style.width = '100%';
                    
                    if (status.result && status.result.search_id) {
                        showAlert('success', `Search completed! Found ${status.result.total_profiles} profiles.`);
                        loadResults(status.result.search_id);
                    } else {
                        showAlert('warning', 'Search completed but no results found.');
                    }
                    
                    currentJobId = null;
                } else if (status.status === 'failed') {
                    progressBar.style.width = '100%';
                    progressBar.classList.add('bg-danger');
                    showAlert('danger', 'Search failed: ' + (status.error || 'Unknown error'));
                    currentJobId = null;
                } else {
                    // Still pending
                    setTimeout(pollJobStatus, 1000);
                }
                
            } catch (error) {
                showAlert('danger', 'Failed to get job status: ' + error.message);
                currentJobId = null;
            }
        }
        
        async function loadResults(searchId) {
            try {
                const response = await fetch(`/results/${searchId}`);
                const data = await response.json();
                
                if (data.error) {
                    showAlert('danger', data.error);
                    return;
                }
                
                displayResults(data, searchId);
                
            } catch (error) {
                showAlert('danger', 'Failed to load results: ' + error.message);
            }
        }
        
        function displayResults(data, searchId) {
            const container = document.getElementById('resultsContainer');
            
            if (!data.profiles || data.profiles.length === 0) {
                container.innerHTML = '<div class="alert alert-info">No profiles found.</div>';
                return;
            }
            
            let html = `
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4><i class="fas fa-users me-2"></i>Found ${data.profiles.length} Profiles</h4>
                    <a href="/export/${searchId}" class="btn btn-success">
                        <i class="fas fa-download me-1"></i>Export CSV
                    </a>
                </div>
            `;
            
            data.profiles.forEach(profile => {
                const platformClass = `platform-${profile.platform || 'other'}`;
                const emails = profile.contacts?.email || [];
                const phones = profile.contacts?.phone || [];
                
                html += `
                    <div class="profile-card">
                        <div class="d-flex justify-content-between align-items-start">
                            <div class="flex-grow-1">
                                <h5 class="mb-2">
                                    ${profile.name || 'Unknown Name'}
                                    <span class="platform-badge ${platformClass}">${profile.platform || 'other'}</span>
                                </h5>
                                
                                ${profile.title ? `<p class="text-muted mb-1"><i class="fas fa-briefcase me-1"></i>${profile.title}</p>` : ''}
                                ${profile.company ? `<p class="text-muted mb-1"><i class="fas fa-building me-1"></i>${profile.company}</p>` : ''}
                                ${profile.location ? `<p class="text-muted mb-1"><i class="fas fa-map-marker-alt me-1"></i>${profile.location}</p>` : ''}
                                
                                <p class="mb-2">
                                    <a href="${profile.url}" target="_blank" class="text-decoration-none">
                                        <i class="fas fa-external-link-alt me-1"></i>View Profile
                                    </a>
                                </p>
                                
                                ${profile.description ? `<p class="text-muted small">${profile.description.substring(0, 200)}${profile.description.length > 200 ? '...' : ''}</p>` : ''}
                                
                                ${emails.length > 0 || phones.length > 0 ? `
                                    <div class="contact-info">
                                        <strong><i class="fas fa-address-book me-1"></i>Contact Information:</strong>
                                        ${emails.length > 0 ? `
                                            <div class="mt-1">
                                                <i class="fas fa-envelope me-1"></i>
                                                ${emails.map(email => `<span class="badge bg-primary me-1">${email}</span>`).join('')}
                                            </div>
                                        ` : ''}
                                        ${phones.length > 0 ? `
                                            <div class="mt-1">
                                                <i class="fas fa-phone me-1"></i>
                                                ${phones.map(phone => `<span class="badge bg-success me-1">${phone}</span>`).join('')}
                                            </div>
                                        ` : ''}
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }
        
        function showAlert(type, message) {
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type} alert-dismissible fade show`;
            alertDiv.innerHTML = `
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
            
            const container = document.getElementById('resultsContainer');
            container.insertBefore(alertDiv, container.firstChild);
            
            // Auto-dismiss after 5 seconds for info/success alerts
            if (type === 'info' || type === 'success') {
                setTimeout(() => {
                    if (alertDiv.parentNode) {
                        alertDiv.remove();
                    }
                }, 5000);
            }
        }
    </script>
</body>
</html>
